name: Jekyll Deploy
on:
  push:
    branches: [source]
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      
      - name: Build Jekyll site
        run: bundle exec jekyll build
      
      - name: Clean up large unnecessary files
        run: |
          # Remove vendor bundle if it was copied
          rm -rf _site/vendor _site/.jekyll-cache _site/.sass-cache 2>/dev/null || true
          # Keep only essential files
          find _site -type f -name "*.log" -delete 2>/dev/null || true
          find _site -type f -name ".DS_Store" -delete 2>/dev/null || true
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/source'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: master
          destination_dir: ./
          force_orphan: true
          full_commit_message: "Deploy site"
          disable_nojekyll: false
        env:
          GIT_LFS_SKIP_SMUDGE: 1
          GIT_HTTP_LOW_SPEED_LIMIT: 0
          GIT_HTTP_LOW_SPEED_TIME: 999999
