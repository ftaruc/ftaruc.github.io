name: Jekyll Deploy
on:
  push:
    branches: [source]
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Clean up disk space
        run: |
          # Clean up system files
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          # Clean up git objects
          git gc --prune=now
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      
      - name: Cache Jekyll build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .jekyll-cache
            .sass-cache
          key: ${{ runner.os }}-jekyll-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jekyll-
      
      - name: Build Jekyll site (incremental)
        run: bundle exec jekyll build --incremental --trace
      
      - name: Clean up large unnecessary files
        run: |
          # Remove vendor bundle if it was copied
          rm -rf _site/vendor _site/.jekyll-cache _site/.sass-cache 2>/dev/null || true
          # Keep only essential files
          find _site -type f -name "*.log" -delete 2>/dev/null || true
          find _site -type f -name ".DS_Store" -delete 2>/dev/null || true
          # Remove cache directories after build (they're already cached)
          rm -rf .jekyll-cache .sass-cache 2>/dev/null || true
          # Clean up Git LFS cache after build
          git lfs prune --force 2>/dev/null || true
          # Clean up git objects
          rm -rf .git/objects/pack/*.keep 2>/dev/null || true
          git gc --prune=now --aggressive 2>/dev/null || true
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/source'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: master
          destination_dir: ./
          force_orphan: false
          full_commit_message: "Deploy site"
          disable_nojekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          keep_files: false
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 0
          GIT_HTTP_LOW_SPEED_TIME: 999999
